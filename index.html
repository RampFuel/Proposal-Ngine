<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RampFuel · Proposal Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Metrophobic&family=Raleway:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --deep-blue:#0C1033; --deep-blue-mid:#131847; --deep-blue-lite:#1b2160;
  --rf-red:#D40B00; --signal-orange:#FF4900; --catalyst-purple:#4E146A;
  --white:#FFFFFF; --off-white:#F5F6FA; --text-muted:#9DA5C4;
  --border:rgba(255,255,255,0.10);
  --font-head:'Metrophobic','Raleway',sans-serif;
  --font-body:'Raleway',-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-body);background:var(--deep-blue);color:var(--white);-webkit-font-smoothing:antialiased;overflow:hidden}

/* Top bar */
.bar{
  height:60px;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;background:rgba(12,16,51,.96);border-bottom:1px solid var(--border);
}
.bar-left{display:flex;align-items:center;gap:14px}
.brandmark{display:flex;align-items:center;gap:9px}
.brand-dot{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,var(--rf-red),var(--signal-orange));box-shadow:0 0 14px rgba(212,11,0,.5)}
.brand-name{font-family:var(--font-head);font-size:16px;font-weight:700;letter-spacing:.01em}
.brand-name .muted{color:var(--text-muted);font-weight:400}
.bar-divider{width:1px;height:26px;background:var(--border)}
.tpl-select{
  background:var(--deep-blue-mid);color:var(--white);border:1px solid var(--border);
  border-radius:7px;padding:8px 12px;font-family:var(--font-body);font-size:13px;font-weight:600;cursor:pointer;
}
.bar-right{display:flex;align-items:center;gap:10px}
.btn{
  display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);
  background:transparent;color:var(--white);padding:9px 15px;border-radius:7px;
  font-family:var(--font-body);font-size:13px;font-weight:600;cursor:pointer;transition:all .18s;white-space:nowrap;
}
.btn:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.28)}
.btn.primary{background:var(--rf-red);border-color:var(--rf-red);font-weight:700;box-shadow:0 3px 16px rgba(212,11,0,.3)}
.btn.primary:hover{background:#b50900}
.btn.ghost{color:var(--text-muted)}

/* Layout */
.shell{display:grid;grid-template-columns:minmax(360px,420px) 1fr;height:calc(100vh - 60px)}
.form-pane{overflow-y:auto;border-right:1px solid var(--border);background:var(--deep-blue)}
.form-pane::-webkit-scrollbar{width:10px}
.form-pane::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:6px}
.pane-intro{padding:20px 24px 6px}
.pane-intro h1{font-family:var(--font-head);font-size:19px;font-weight:700;margin-bottom:6px}
.pane-intro p{font-size:12.5px;color:var(--text-muted);line-height:1.6}
.phase-chip{
  display:inline-block;margin-top:12px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:#ff6b5b;background:rgba(212,11,0,.12);border:1px solid rgba(212,11,0,.28);border-radius:5px;padding:5px 10px;
}
.group{padding:8px 24px 4px}
.group-title{
  font-family:var(--font-head);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-muted);margin:18px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);
}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--off-white);margin-bottom:6px}
.field .help{display:block;font-size:11px;color:var(--text-muted);margin-top:5px;line-height:1.5}
.field input,.field textarea{
  width:100%;background:var(--deep-blue-mid);border:1px solid var(--border);border-radius:8px;
  color:var(--white);font-family:var(--font-body);font-size:13.5px;padding:10px 12px;line-height:1.5;transition:border-color .15s;
}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--rf-red)}
.field textarea{resize:vertical;min-height:74px}

/* Preview */
.preview-pane{display:flex;flex-direction:column;background:#070a20;min-width:0}
.preview-top{
  height:40px;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;background:rgba(12,16,51,.6);border-bottom:1px solid var(--border);
}
.preview-label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}
.preview-status{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-muted)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--signal-orange);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.preview-frame-wrap{flex:1;padding:16px;overflow:hidden}
iframe#preview{width:100%;height:100%;border:1px solid var(--border);border-radius:12px;background:var(--deep-blue);box-shadow:0 18px 60px rgba(0,0,0,.5)}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--deep-blue-lite);border:1px solid rgba(255,255,255,.2);color:var(--white);
  padding:12px 20px;border-radius:9px;font-size:13px;font-weight:600;opacity:0;transition:all .25s;pointer-events:none;z-index:999;
  box-shadow:0 10px 40px rgba(0,0,0,.5);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:900px){.shell{grid-template-columns:1fr;height:auto}.preview-pane{height:80vh}}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-left">
    <div class="brandmark">
      <span class="brand-dot"></span>
      <span class="brand-name">RampFuel <span class="muted">Proposal Engine</span></span>
    </div>
    <div class="bar-divider"></div>
    <select class="tpl-select" id="tplSelect"></select>
  </div>
  <div class="bar-right">
    <button class="btn ghost" id="resetBtn" title="Reset all fields to the example values">Reset example</button>
    <button class="btn" id="copyBtn">Copy HTML</button>
    <button class="btn" id="pdfBtn">Print / PDF</button>
    <button class="btn primary" id="downloadBtn">Download proposal</button>
  </div>
</div>

<div class="shell">
  <div class="form-pane">
    <div class="pane-intro">
      <h1>Build a proposal</h1>
      <p>Fill the fields below. The branded proposal on the right updates live. When it looks right, download a standalone HTML file you can send to the client.</p>
      <span class="phase-chip">Phase 1 · Generate &amp; share</span>
    </div>
    <form id="form"></form>
  </div>

  <div class="preview-pane">
    <div class="preview-top">
      <span class="preview-label">Live preview</span>
      <span class="preview-status"><span class="live-dot"></span> Updating live</span>
    </div>
    <div class="preview-frame-wrap">
      <iframe id="preview" title="Proposal preview"></iframe>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

: "textarea", "default": "Design partner rate — reflects MachBlue's August launch window and early collaboration on the BlueScan channel motion. Applies to this quote only."}, {"group": "Commercials", "key": "paymentTerms", "label": "Payment terms", "type": "textarea", "default": "100% due on execution of the agreement. One-time fee. No retainer, no auto-renewal."}, {"group": "Commercials", "key": "timeline", "label": "Timeline", "type": "text", "default": "2 to 4 weeks"}, {"group": "Commercials", "key": "timelineNote", "label": "Timeline note", "type": "text", "default": "Aligned to your August launch window."}, {"group": "Opening", "key": "situationHeadline", "label": "Situation headline", "type": "textarea", "default": "You are about to launch into a channel that will not forgive a pricing mistake."}, {"group": "Opening", "key": "situationBody", "label": "Situation body", "type": "textarea", "default": "BlueScan is already resonating with your design partners, which is the hard part. What is still open is how MachBlue prices it, who it is actually for, and how the AI SoC story lands with MSPs who have heard every AI claim in the market this year. Those three questions compound: get pricing wrong and the positioning cannot rescue it; get the ICP wrong and the pricing is irrelevant. The RAMP Report is built to close exactly that gap before launch, not after.", "help": "2 to 4 sentences. Be concrete and client-specific."}, {"group": "Links", "key": "acceptUrl", "label": "Accept button URL", "type": "text", "default": "https://REPLACE-ME.example.com/rampfuel-accept-quote", "help": "HubSpot form, PandaDoc, or DocuSign link"}, {"group": "Links", "key": "questionsUrl", "label": "Questions link", "type": "text", "default": "mailto:jared@rampfuel.com?subject=Question%20on%20the%20RAMP%20Report%20quote"}]}}</script>
<script>
const CONFIG = JSON.parse(document.getElementById('cfg').textContent);

function b64ToUtf8(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

let currentKey = Object.keys(CONFIG)[0];
let currentData = {};

const form = document.getElementById('form');
const preview = document.getElementById('preview');
const tplSelect = document.getElementById('tplSelect');
const toast = document.getElementById('toast');

// Populate template selector
Object.entries(CONFIG).forEach(([key,t])=>{
  const o = document.createElement('option');
  o.value = key; o.textContent = t.name;
  tplSelect.appendChild(o);
});
tplSelect.value = currentKey;
tplSelect.addEventListener('change', ()=>{ currentKey = tplSelect.value; renderForm(); });

function renderForm(){
  const tpl = CONFIG[currentKey];
  form.innerHTML = '';
  currentData = {};
  let lastGroup = null;
  tpl.fields.forEach(f=>{
    if(f.group !== lastGroup){
      const g = document.createElement('div'); g.className='group';
      const gt = document.createElement('div'); gt.className='group-title'; gt.textContent=f.group;
      g.appendChild(gt); form.appendChild(g);
      lastGroup = f.group;
    }
    const wrap = document.createElement('div'); wrap.className='field';
    const lab = document.createElement('label'); lab.textContent=f.label; lab.htmlFor='f_'+f.key;
    wrap.appendChild(lab);
    const el = f.type==='textarea' ? document.createElement('textarea') : document.createElement('input');
    el.id='f_'+f.key; el.value=f.default||''; el.dataset.key=f.key;
    if(f.type!=='textarea') el.type='text';
    el.addEventListener('input', ()=>{ currentData[f.key]=el.value; scheduleRender(); });
    wrap.appendChild(el);
    if(f.help){ const h=document.createElement('span'); h.className='help'; h.textContent=f.help; wrap.appendChild(h); }
    // attach to the current group container
    form.lastChild.appendChild(wrap);
    currentData[f.key]=f.default||'';
  });
  renderPreview();
}

function buildProposalHTML(){
  const skeleton = b64ToUtf8(CONFIG[currentKey].skeletonB64);
  return skeleton.replace('__QUOTE_TOKEN__', JSON.stringify(currentData));
}

function renderPreview(){
  preview.srcdoc = buildProposalHTML();
}

let renderTimer=null;
function scheduleRender(){
  clearTimeout(renderTimer);
  renderTimer=setTimeout(renderPreview,250);
}

function safeName(){
  const c=(currentData.company||'proposal').replace(/[^a-z0-9]+/gi,'_').replace(/^_+|_+$/g,'');
  return 'RampFuel_Proposal_'+c+'.html';
}

function showToast(msg){
  toast.textContent=msg; toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),1900);
}

document.getElementById('downloadBtn').addEventListener('click',()=>{
  const blob=new Blob([buildProposalHTML()],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=safeName();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  showToast('Downloaded '+safeName());
});

document.getElementById('copyBtn').addEventListener('click',async()=>{
  try{ await navigator.clipboard.writeText(buildProposalHTML()); showToast('Proposal HTML copied to clipboard'); }
  catch(e){ showToast('Copy failed — use Download instead'); }
});

document.getElementById('pdfBtn').addEventListener('click',()=>{
  const w=window.open('','_blank');
  if(!w){ showToast('Allow pop-ups to use Save as PDF'); return; }
  w.document.open(); w.document.write(buildProposalHTML()); w.document.close();
  w.onload=()=>{ setTimeout(()=>w.print(),400); };
  showToast('Opening print dialog — choose “Save as PDF”');
});

document.getElementById('resetBtn').addEventListener('click',()=>{ renderForm(); showToast('Reset to example values'); });

renderForm();
</script>
</body>
